<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 是 env(safe-area-inset-*) 生效的前提，
         少了它底部 tab 会压在 iPhone 的横条上 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>有信</title>
    <meta name="description" content="有信 · 我们替你留意，然后把信递到手上" />

    <!-- 三个主题态都要给浏览器一个底色，否则深色模式下加载瞬间会闪白 -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EFF1EC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121715" />

    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="有信" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
