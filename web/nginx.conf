# 前端容器的 nginx：只做静态产物与 SPA 回落。
#
# /api/ 与 /img/ 不在这里处理 —— 共享 nginx（宿主机上的 jianjian-nginx）
# 已经把这两条直接转给了 api 与 media 容器。保持这里只认静态，是为了
# 让「前端容器」这件事简单到不会配错。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 万一有人把 /api/ 或 /img/ 转到这个容器来，直接 404，而不是让 SPA
    # 回落把 index.html 当成 200 返回 —— 那会让前端拿到一坨 HTML 去
    # JSON.parse，报出来的错跟路由配错毫无关系。
    location /api/ { return 404; }
    location /img/ { return 404; }

    # 带 hash 的产物：内容一变文件名就变，可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /icons/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Service Worker 与它的登记脚本、workbox 运行时一律不许缓存。
    # 这几个文件被浏览器缓存住，等于新版本永远发不出去 —— 用户会卡在
    # 旧版本上，而且刷新也没用（刷新的还是缓存里那个 SW）。
    location = /sw.js            { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /registerSW.js    { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /push-sw.js       { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; }
    location ~ ^/workbox-.*\.js$ { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }

    # SPA 回落：除上面这些以外，任何路径都交给前端路由。
    # index.html 同样不许缓存，否则新版本发布了用户还是要刷新两次才看到。
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
