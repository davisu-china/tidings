# 有信 tidings.jianjiange.site —— 共享 nginx 的一段 vhost
#
# 这份文件是**仓库内的记录**，不是被挂载的配置：真正生效的是宿主机上
# /opt/jianjian/deploy/nginx/nginx.conf 里同名的一段（由 deploy/deploy.sh
# 合并进去后 reload）。留着它的原因与不将就的 love.conf 一样 ——
# 线上配置改了什么，得能在仓库里查到。
#
# 合并注意：那个文件在 jianjian-nginx 容器里是**只读文件挂载**，
# 必须原地覆盖（cat new > old / cp），不能用 sed -i —— sed -i 会换 inode，
# 容器读到的还是旧文件，表现成「改了没生效」。

server {
    listen 443 ssl;
    http2 on;
    server_name tidings.jianjiange.site;
    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/tidings.jianjiange.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tidings.jianjiange.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- 管理面与指标：明确拒绝 ---
    #
    # 这两条不是多余的：下面的 location / 会把所有未匹配的路径转给前端容器，
    # 而前端容器有 SPA 回落 —— 不拦住的话 /metrics 会返回一张 HTML 页面
    # （200），看起来像「接口存在但返回了奇怪的东西」。
    location /metrics { return 404; }
    location /minio/  { return 404; }

    # --- 前端静态产物 ---
    location / {
        proxy_pass http://tidings-web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 接口 ---
    #
    # Upgrade / Connection 与 3600s 读超时是给 WebSocket 用的（/api/v1/ws）。
    # Host 透传是必须的：hub 的 Serve 会校验 Origin 的 host 等于请求的
    # Host，改写了就握手 403。
    location /api/ {
        proxy_pass http://tidings-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # --- 图片读取（桶的匿名只读只开 GetObject）---
    location /img/ {
        proxy_pass http://tidings-media;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 预签名直传落点 ---
    #
    # 路径就是桶名，与 MINIO_BUCKET 一致（deploy/.env）。改桶名要同时改这里、
    # 下面 media 容器的 MINIO_BUCKET 与 deploy/nginx/default.conf.template。
    #
    # 这里一个 CORS 头都不加：页面与图片同域，本来就没有跨域请求；
    # 而预签名 PUT 的预检由 MinIO 自己回答，加一条 Access-Control-Allow-Origin
    # 会与它回的那条重名，浏览器判定「multiple values」后把整个响应拒掉。
    location /tidings/ {
        proxy_pass http://tidings-media;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        proxy_request_buffering off;
    }
}
