# Tidings · 本地开发编排
#
# 用法：
#   cp deploy/.env.example deploy/.env
#   make up
#   curl localhost:8081/healthz
#
# 生产还需要在前面加 nginx（TLS 终止 / 静态资源 / API 反代），
# 等前端产物出来再补。
#
# 端口一律避开 stubborn-love：那套用 5432 / 6379 / 8090 / 9100，
# 这里用 5434 / 6380 / 8081 / 9200。两套同时起不冲突。
#
# postgres 原本写的是 5433，但那个端口已经被同一个开发机上的
# gaokao-postgres 占着 —— 容器起不来，报「port is already allocated」。
# 挪到 5434。api 与 worker 走的是内网的 postgres:5432，
# 这个映射只影响「从宿主机 psql 连进去」，所以改它不影响任何服务。

name: tidings

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 中文排序与大小写行为按 C locale，避免不同环境结果不一致
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF everysec：崩溃最多丢 1 秒。验证码与频次计数丢了可接受，
    # 大不了让用户重新发一次码。
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    ports:
      # host 端口走 92xx，避开 stubborn-love 的 91xx。
      # 容器内仍是 9000/9001，api 走 minio:9000 不受影响。
      - "9200:9000"   # S3 API
      - "9201:9001"   # 控制台
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 15

  # MinIO 对外入口：图片读取 + 预签名直传落点。
  # 用 nginx 而不是直接暴露 minio:9000，是为了把管理面挡在外面。
  media:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET}
      # nginx 官方镜像会把 templates 下的文件做变量替换后写入 conf.d。
      # FILTER 限定只替换 MINIO_* —— 否则 envsubst 会把模板里的
      # $host、$remote_addr 这些 nginx 自己的变量也一并吃掉。
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: .template
      NGINX_ENVSUBST_FILTER: "^MINIO_"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "8093:80"
    depends_on:
      minio:
        condition: service_healthy

  api:
    build:
      context: ../backend
      args:
        TARGET: api
    restart: unless-stopped
    env_file: .env
    environment:
      # 预签名 URL 要用浏览器能访问到的地址，不能用 compose 内网的 minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:8093
      MEDIA_BASE_URL: http://localhost:8093
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 后台任务。与 api 同一个镜像、同一份配置，只是换了个入口 ——
  # 业务规则一份都不复制，worker 里发生的每一次写入走的都是 api 用的
  # 那套校验和事务边界。
  #
  # 没有 ports：它不对外服务，只连内网的 postgres / redis。
  # 也不需要 depends_on postgres 健康 —— 迁移由 api 负责跑，
  # 而 worker 起得比迁移早时只会空转一轮，不会写坏任何东西。
  worker:
    build:
      context: ../backend
      args:
        TARGET: worker
    restart: unless-stopped
    env_file: .env
    environment:
      MINIO_PUBLIC_ENDPOINT: localhost:8093
      MEDIA_BASE_URL: http://localhost:8093
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
